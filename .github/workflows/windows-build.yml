name: Windows portable app
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build and verify the actual Windows executable
        shell: pwsh
        run: ./windows/build.ps1 -Runtime win-x64 -VerifyUI
      - name: Upload app-only Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-verification
          path: windows/artifacts/verification-win-x64
          if-no-files-found: warn
          retention-days: 14
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v5
        with:
          name: PokerCalculator-Windows-x64
          path: |
            windows/artifacts/PokerCalculator-Windows-x64.zip
            windows/artifacts/PokerCalculator-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
